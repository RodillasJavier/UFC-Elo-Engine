services:
  - type: web
    name: ufc-elo-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: FRONTEND_URL
        value: https://your-vercel-app.vercel.app
